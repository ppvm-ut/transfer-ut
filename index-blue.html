<style>

/* Layout: one centered phone (375×812) on a quiet stage; page chrome only around it. */
:root {

}

}
:root[data-theme="dark"] {

html, body { height: 100%; }

/* card sheet: «Выбрать» disabled until a card is chosen */

.sx-btn svg { display: block; flex: none; }
.sx-btn--soft { background: var(--lf-card); color: var(--content-primary); cursor: default; }
.sx-btn--dark { background: var(--lf-dark); color: var(--white); transition: transform .12s; }
.sx-btn--dark:active { transform: scale(.98); }
.sx-homeind { background: var(--fill-subtle); }
.sx-reveal { transition: opacity .36s ease, transform .42s cubic-bezier(.2,.8,.2,1); }
.sx.is-loading .sx-reveal { opacity: 0; transform: translateY(12px); }
.sx.is-loading.is-shown .sx-reveal { opacity: 1; transform: none; }
.sx-orb { position: absolute; left: 147.5px; top: 408.5px; width: 80px; height: 80px; z-index: 3; pointer-events: none; transform-origin: 50% 50%; }
.sx-orb svg { display: block; overflow: visible; }
.lg-piece { stroke: #0365E3; stroke-width: 0; stroke-linejoin: round; transform-origin: 40px 40px; }
.lg-solid { opacity: 0; }
/* final screen of the usability test (transfer) */
.fin-content { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 32px; text-align: center; }
.fin-title { margin: 0; font: 600 24px/32px var(--font-onest); color: var(--content-primary); }
.fin-sub { margin: 0; font: 400 16px/22px var(--font-onest); color: var(--content-secondary); }
.fin .sx-btn { text-decoration: none; }
/* softer easing for the success sequence (overrides) */
.sx-halo { transition: transform .5s cubic-bezier(.16,1,.3,1), opacity .35s ease-out; }
.sx.is-morph .sx-halo { transition-delay: .18s; }
.sx.is-check .sx-check { transition: stroke-dashoffset .34s cubic-bezier(.65,0,.35,1); }
.sx-reveal { transition: opacity .4s ease-out, transform .5s cubic-bezier(.16,1,.3,1); }
.sx-btn--primary { width: 100%; box-sizing: border-box; background: var(--accent); color: var(--white); transition: transform .12s; }
.sx-btn--primary:active { transform: scale(.98); }
/* ---------- home («Главная») ---------- */
.flow { display: contents; }
.home { background: #f4f6f8; }
.home-bg { position: absolute; left: 0; top: 0; width: 375px; height: 812px; display: block; max-width: none; pointer-events: none; }
.hc-row { position: absolute; left: 0; top: 266px; width: 375px; height: 180px; overflow: hidden; touch-action: pan-y; cursor: grab; }
.hc-row.is-drag { cursor: grabbing; }
.hc-track { display: flex; gap: 4px; padding-left: 15px; height: 180px; will-change: transform; transform: translate3d(0,0,0); }
.hc-track.is-settling { transition: transform .5s cubic-bezier(.22,1,.36,1); }
.hc-card { position: relative; flex: none; width: 278px; height: 180px; border-radius: 20px; overflow: hidden; padding: 0; text-align: left; }
.hc-card img { position: absolute; inset: 0; width: 278px; height: 180px; display: block; max-width: none; pointer-events: none; -webkit-user-drag: none; }
.hc-info { position: absolute; left: 16px; top: 108px; display: flex; flex-direction: column; gap: 2px; color: #fff; pointer-events: none; }
.hc-bal { display: flex; gap: 4px; font: 700 32px/38px var(--font-inter); letter-spacing: -0.01em; white-space: nowrap; }
.hc-num { font: 400 12px/16px var(--font-inter); }
.hot-plain { position: absolute; border-radius: 26px; }
/* card sheet («Реквизиты карты») */
.cs-layer { position: absolute; inset: 0; z-index: 20; }
.cs-scrim { position: absolute; inset: 0; background: rgba(20,28,33,0.5); opacity: 0; transition: opacity .25s ease; }
.cs-panel { position: absolute; left: 0; right: 0; top: 104px; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; overflow: hidden; transform: translateY(100%); transition: transform .34s var(--ease); }
.cs-layer.is-open .cs-scrim { opacity: 1; }
.cs-layer.is-open .cs-panel { transform: none; }
.cs-scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.cs-scroll::-webkit-scrollbar { display: none; }
.cs-content { position: relative; width: 375px; height: 898px; }
.cs-bg { position: absolute; left: 0; top: 0; width: 375px; height: 898px; display: block; max-width: none; }
.cs-mini { position: absolute; left: 88px; top: 24px; width: 200px; height: 130px; border-radius: 16px; overflow: hidden; }
.cs-mini img { position: absolute; inset: 0; width: 200px; height: 130px; display: block; max-width: none; }
.cs-badge { position: absolute; left: 12px; top: 12px; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 100px; background: rgba(255,255,255,0.15); color: #fff; font: 400 10px/12px var(--font-inter); white-space: nowrap; }
.cs-badge svg { display: block; width: 12px; height: 12px; }
.cs-badge svg path { fill: currentColor; }
.cs-bal { position: absolute; left: 12px; top: 92px; display: flex; gap: 4px; color: #fff; font: 700 24px/30px var(--font-inter); letter-spacing: -0.005em; white-space: nowrap; }
.cs-number { position: absolute; left: 40px; top: 318px; width: 248px; height: 28px; background: #f6f8fa; display: flex; align-items: center; padding-left: 5.5px; box-sizing: border-box; font: 300 12px/16px "Martian Mono", ui-monospace, monospace; letter-spacing: -0.05em; color: #10161a; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  .cs-scrim, .cs-panel { transition: none !important; }
  .tp-seg-thumb, .tp-logo, .tp-promo { transition: none !important; }
}

  // analytics (Yandex Metrika is injected only into the GitHub Pages build): every goal carries the variant
  var VARIANT = window.PROTO_VARIANT || "blue";
  function ymGoal(goal, cb) {
    var called = false, fin = function () { if (!called) { called = true; if (cb) cb(); } };
    try {
      if (window.ym && window.YM_ID) {
        var p = {}; p[VARIANT] = {}; p[VARIANT][goal] = 1;
        window.ym(window.YM_ID, "reachGoal", goal, { variant: VARIANT }, fin);
        window.ym(window.YM_ID, "params", p);
      }
    } catch (err) {}
    if (cb) setTimeout(fin, window.ym && window.YM_ID ? 700 : 0);
  }
  var NB = " ";
  var RATE = 100, PROMO = "ХАЛЯВА", BONUS_USD = 129, MIN_USD = 5, FEE_RATE = 0.01, CHECK_DELAY = 300;
  function fee(u) { return Math.round(u * FEE_RATE * 100) / 100; }   // transfer fee: 1% of the amount

  var MAX_INT = { USD: 6, RUB: 8 };

  // ---------- formatting ----------
  function group(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, NB); }
  function fmt(n) { var r = Math.round(n * 100) / 100, i = Math.floor(r), d = Math.round((r - i) * 100); return group(String(i)) + (d ? "," + (d < 10 ? "0" + d : String(d)).replace(/0$/, "") : ""); }
  function toStr(n) { var r = Math.round(n * 100) / 100, i = Math.floor(r), d = Math.round((r - i) * 100); return d ? String(i) + "," + (d < 10 ? "0" + d : String(d)).replace(/0$/, "") : String(i); }
  function balComma(n) { var p = n.toFixed(2).split("."); return "$" + group(p[0]) + "," + p[1]; }   // «$105,24» — as in the nav of the frames
  function balDot(n) { var p = n.toFixed(2).split("."); return "$" + group(p[0]) + "." + p[1]; }     // «$1 243.32» — as in the picker and the success screen

    if (reduce || !node || !node.animate) return { finished: Promise.resolve(), cancel: function () {} };

      A(solid, [{ opacity: 0 }, { opacity: 1 }], { duration: 180, delay: 978, easing: "cubic-bezier(.32,0,.67,0)" });
      wait(1178).then(function () {
        if (my !== seq) return;
        var s = E("status"), dx = s.offsetLeft + 32 - (orb.offsetLeft + 40), dy = s.offsetTop + 32 - (orb.offsetTop + 40);
        done.classList.add("is-morph");
        return A(orb, [{ transform: "none" }, { transform: "translate(" + dx + "px," + dy + "px) scale(" + (29.25 / 80) + ")" }], { duration: 520, easing: "cubic-bezier(.5,0,.2,1)" }).finished;
      }).then(function () { if (my !== seq) return; orb.style.visibility = "hidden"; done.classList.add("is-check"); return wait(200); })
        .then(function () { if (my !== seq) return; done.classList.add("is-shown"); });
    }

    function submit() {
      var u = usd();
      if (u < MIN_USD) { tg("err_min"); st.err = null; st.minErr = true; render(); shake(E("hint")); return; }
      if (!T && !st.dest) { tg("err_nodest"); openCards("dest"); return; }
      if (!T) {
        var h = card(st.head);
        if (u > h.bal + 1e-9) { tg("err_funds"); st.minErr = false; st.err = "Недостаточно денег для перевода"; render(); shake(E("hint")); return; }
      }
      tg("success"); success();
    }

    function restart() {
      stopSuccess(); reset(); buildAdds(); render(); renderField();
      Object.keys(layers).forEach(function (k) { if (layers[k]) { layers[k].hidden = true; layers[k].classList.remove("is-open"); } });
      if (T) E("pfoot").classList.remove("kb-on");
      scr.main.hidden = true; scr.done.hidden = true; scr.main.style.zIndex = scr.done.style.zIndex = "";
      if (scr.fin) { scr.fin.hidden = true; scr.fin.style.zIndex = ""; } busy = false;
    }
    // entry from «Главная»: the flow is bound to the card that is active there
    function open(cardId) {
      restart(); st.head = cardId; render();
      return scr.main;
    }

    // ---------- events ----------
    root.addEventListener("mousedown", function (e) { if (e.target.closest('[data-act="promo-apply"]')) e.preventDefault(); });
    root.addEventListener("click", function (e) {
      var t = e.target, a = t.closest("[data-act]"), act = a && root.contains(a) ? a.dataset.act : null;
      if (act === "sheet-close") { tg(st.sheet === "promo" ? "promo_close" : "card_sheet_close"); closeSheet(); return; }
      if (act === "back") { tg("back"); closeSheet(); app.home(scr.main); return; }
      if (act === "pick-head") { tg("pick_head"); openCards("head"); return; }
      if (act === "pick-dest") { tg("pick_dest"); openCards("dest"); return; }
      if (act === "card-confirm") { tg("card_confirm"); confirmCard(); return; }
      if (act === "promo-apply") { applyPromo(); return; }
      // back to the testing service: close the tab; if the browser refuses, follow the link instead
      if (act === "return") {
        e.preventDefault();
        var href = a.href;
        tg("return", function () {   // the goal is sent first, then the tab closes
          try { window.close(); } catch (err) {}
          setTimeout(function () { if (!window.closed) (window.top || window).location.href = href; }, 500);
        });
        return;
      }
      if (act === "finish") { tg("ok"); go("fin", "fwd"); return; }
      if (act === "done") { tg(a.classList.contains("hot") ? "success_back" : "ok"); app.home(scr.done, function () { restart(); }); return; }
      var opt = t.closest(".card-opt");
      if (opt && root.contains(opt)) {
        st.pick = opt.dataset.id;
        Array.prototype.forEach.call(E("cardList").children, function (x) { var on = x.dataset.id === st.pick; x.classList.toggle("is-on", on); x.setAttribute("aria-checked", String(on)); });

        return;
      }
      var key = t.closest('[data-el="keypad"] .key'); if (key) { press(key.dataset.k); return; }
      var chip = t.closest("[data-add]"); if (chip) { tg("chip_" + chip.dataset.add); add(Number(chip.dataset.add)); return; }
      var seg = t.closest('[data-el="seg"] button'); if (seg) { if (seg.dataset.cur !== st.cur) tg("currency_" + seg.dataset.cur.toLowerCase()); setCur(seg.dataset.cur); return; }
      var promo = t.closest('[data-el="promo"]');
      if (promo) {
        if (st.promo) {
          if (t.closest(".tp-promo-x")) tg("promo_remove");
          if (t.closest(".tp-promo-x")) anim(promo, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(.92)" }], { duration: 160 }).finished.then(function () { st.promo = false; render(); pop(promo); });
          return;
        }
        tg("promo_open"); clearTimeout(checkTimer); st.code = ""; st.error = false; st.checked = false; renderField(); openSheet("promo"); return;
      }
      if (t.closest('[data-el="cta"]')) { tg("cta"); submit(); return; }
    });
    document.addEventListener("keydown", function (e) {
      if (window.PROTO_MODE !== mode || st.screen === "off" || e.metaKey || e.ctrlKey || e.altKey) return;
      if (st.sheet) { if (e.key === "Escape") closeSheet(); return; }
      if (st.screen !== "main") return;
      if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === "," || e.key === ".") press(","); else if (e.key === "Backspace") press("back"); else if (e.key === "Enter") submit();
    });

    buildAdds(); render(); renderField();
    return { restart: restart, open: open, setScreen: function (k) { st.screen = k; } };
  }

  // ---------- «Главная»: card carousel, entry buttons, card sheet ----------
  var phone = document.getElementById("phone");
  var BADGE = { travel: I.badgeTravel, subs: I.badgeSubs, premium: I.badgePremium };
  function balParts(n) { var p = n.toFixed(2).split("."); return group(p[0]) + "." + p[1]; }
  phone.insertAdjacentHTML("beforeend",
    '<section class="screen home" data-s="home" aria-label="Главная"><img class="home-bg" src="' + IMG.homeBg + '" alt="">' +
      '<div class="hc-row" data-el="hcRow"><div class="hc-track" data-el="hcTrack">' + HOME_ORDER.map(function (id) {
        var c = card(id);
        return '<button class="hc-card" type="button" data-card="' + id + '" aria-label="' + c.title + '"><img src="' + IMG.head[id] + '" alt="">' +
          '<span class="hc-info"><span class="hc-bal"><span>$</span><span data-bal="' + id + '"></span></span><span class="hc-num">••••' + c.last + '</span></span></button>';
      }).join("") + '</div></div>' +
      '<button class="hot-plain" type="button" data-home="topup" aria-label="Пополнить" style="left:16px;top:672px;width:223px;height:52px"></button>' +
      '<button class="hot-plain" type="button" data-home="transfer" aria-label="Перевести" style="left:247px;top:672px;width:52px;height:52px"></button>' +
      '<button class="hot-plain" type="button" data-home="plus" aria-label="Добавить карту" style="left:307px;top:672px;width:52px;height:52px"></button>' +
      '<div class="cs-layer" data-el="cs" hidden><div class="cs-scrim" data-cs="close"></div><div class="cs-panel" role="dialog" aria-modal="true" aria-label="Карта"><div class="cs-scroll" data-el="csScroll"><div class="cs-content">' +
        '<img class="cs-bg" src="' + IMG.sheet + '" alt="">' +
        '<div class="cs-mini"><img data-el="csPic" alt=""><span class="cs-badge" data-el="csBadge"></span><span class="cs-bal"><span>$</span><span data-el="csBal"></span></span></div>' +
        '<div class="cs-number" data-el="csNum"></div>' +
        '<button class="hot-plain" type="button" data-cs="transfer" aria-label="Перевести" style="left:16px;top:174px;width:109px;height:76px;border-radius:12px"></button>' +
        '<button class="hot-plain" type="button" data-cs="topup" aria-label="Пополнить" style="left:133px;top:174px;width:109px;height:76px;border-radius:12px"></button>' +
        '<button class="hot-plain" type="button" data-cs="freeze" aria-label="Заморозить" style="left:250px;top:174px;width:109px;height:76px;border-radius:12px"></button>' +
      '</div></div></div></div>' +
    '</section>');
  var home = phone.querySelector('[data-s="home"]'), row = phone.querySelector('[data-el="hcRow"]');
  var csLayer = phone.querySelector('[data-el="cs"]'), csCard = null, csTimer = null;
  var PITCH = 282;   // card 278 + gap 4
  var track = phone.querySelector('[data-el="hcTrack"]'), cur = 0, offset = 0;
  function activeIndex() { return cur; }
  function activeCard() { return HOME_ORDER[activeIndex()]; }
  function refreshHome() {
    HOME_ORDER.forEach(function (id) { phone.querySelector('[data-bal="' + id + '"]').textContent = balParts(card(id).bal); });
    if (csCard) fillSheet(csCard);
  }
  function fillSheet(id) {
    var c = card(id);
    phone.querySelector('[data-el="csPic"]').src = IMG.pic[id];
    phone.querySelector('[data-el="csBadge"]').innerHTML = BADGE[id] + "<span>" + c.title + "</span>";
    phone.querySelector('[data-el="csBal"]').textContent = balParts(c.bal);
    phone.querySelector('[data-el="csNum"]').textContent = "1234 5678 9012 " + c.last;
  }
  function openCardSheet(id) {
    csCard = id; fillSheet(id); clearTimeout(csTimer);
    phone.querySelector('[data-el="csScroll"]').scrollTop = 0;
    csLayer.hidden = false; void csLayer.offsetWidth; csLayer.classList.add("is-open");
  }
  function closeCardSheet(cb) {
    csLayer.classList.remove("is-open"); clearTimeout(csTimer);
    csTimer = setTimeout(function () { csLayer.hidden = true; csCard = null; if (cb) cb(); }, reduce ? 0 : 300);
  }

  // carousel: our own drag (mouse, touch, pen) + trackpad wheel, settling on a card with a soft ease-out
  var MAX = (HOME_ORDER.length - 1) * PITCH, drag = null, moved = false, wheelTimer = null;
  function scale() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--s")) || 1; }
  function setX(x, settle) {
    offset = x;
    track.classList.toggle("is-settling", !!settle && !reduce);
    track.style.transform = "translate3d(" + (-x) + "px,0,0)";
  }
  function rubber(x) {   // resistance past the first / last card
    if (x < 0) return x * 0.35;
    if (x > MAX) return MAX + (x - MAX) * 0.35;
    return x;
  }
  function snapTo(i) { cur = Math.max(0, Math.min(HOME_ORDER.length - 1, i)); setX(cur * PITCH, true); }
  row.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, base: offset, id: e.pointerId, samples: [{ t: performance.now(), x: e.clientX }], axis: null };
    moved = false;
  });
  window.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = (e.clientX - drag.x) / scale(), dy = (e.clientY - drag.y) / scale();
    if (!drag.axis) { if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return; drag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y"; if (drag.axis === "x") { moved = true; row.classList.add("is-drag"); try { row.setPointerCapture(e.pointerId); } catch (err) {} } }
    if (drag.axis !== "x") return;
    e.preventDefault();
    setX(rubber(drag.base - dx), false);
    drag.samples.push({ t: performance.now(), x: e.clientX }); if (drag.samples.length > 6) drag.samples.shift();
  }, { passive: false });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (drag.axis === "x") {
      var s0 = drag.samples[0], s1 = drag.samples[drag.samples.length - 1], dt = Math.max(16, s1.t - s0.t);
      var v = (s1.x - s0.x) / scale() / dt;                  // px per ms, positive = finger to the right
      var dx = (e.clientX - drag.x) / scale(), from = Math.round(drag.base / PITCH), target = Math.round((offset - v * 180) / PITCH);
      if (target === from && Math.abs(dx) > 40) target = from + (dx < 0 ? 1 : -1);   // a short deliberate swipe still turns the card
      target = Math.max(from - 1, Math.min(from + 1, target));                       // one card per swipe
      row.classList.remove("is-drag"); if (target !== from && target >= 0 && target < HOME_ORDER.length) ymGoal("home_swipe"); snapTo(target);
    }
    drag = null;
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  row.addEventListener("wheel", function (e) {   // horizontal trackpad scroll
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    setX(rubber(offset + e.deltaX / scale()), false);
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(function () { snapTo(Math.round(Math.max(0, Math.min(MAX, offset)) / PITCH)); }, 90);
  }, { passive: false });

  // navigation between «Главная» and the flows
  var navBusy = false;
  function nav(from, to, fwd, cb) {
    if (navBusy) return; navBusy = true; to.hidden = false;
    to.style.zIndex = fwd ? 2 : 1; from.style.zIndex = fwd ? 1 : 2;
    var a = anim(to, fwd ? [{ transform: "translateX(100%)" }, { transform: "none" }] : [{ transform: "translateX(-30%)", filter: "brightness(.92)" }, { transform: "none", filter: "brightness(1)" }]);
    anim(from, fwd ? [{ transform: "none", filter: "brightness(1)" }, { transform: "translateX(-30%)", filter: "brightness(.92)" }] : [{ transform: "none" }, { transform: "translateX(100%)" }]);
    a.finished.then(function () { from.hidden = true; from.style.zIndex = ""; to.style.zIndex = ""; navBusy = false; if (cb) cb(); });
  }
  var flows;
  var app = {
    refresh: refreshHome,
    home: function (fromEl, cb) {
      var m = window.PROTO_MODE; window.PROTO_MODE = "home";
      flows[m].setScreen("off");
      nav(fromEl, home, false, cb);
    }
  };
  flows = { topup: createFlow("topup", app), transfer: createFlow("transfer", app) };
  function enter(mode, cardId, cb) {
    var main = flows[mode].open(cardId);
    flows[mode].setScreen("main"); window.PROTO_MODE = mode;
    nav(home, main, true, cb);
  }
  function dropCardSheet() { clearTimeout(csTimer); csLayer.classList.remove("is-open"); csLayer.hidden = true; csCard = null; }
  home.addEventListener("click", function (e) {
    var t = e.target;
    var csAct = t.closest("[data-cs]");
    if (csAct) {
      var a = csAct.dataset.cs, id = csCard;
      ymGoal("card_sheet_" + a);
      if (a === "close") closeCardSheet();
      else if (a === "topup" || a === "transfer") enter(a, id, dropCardSheet);   // the flow slides in over home with the sheet still open
      return;   // «Заморозить» does nothing yet
    }
    var c = t.closest(".hc-card");
    if (c) {
      if (moved) { moved = false; return; }
      var i = HOME_ORDER.indexOf(c.dataset.card);
      if (i === activeIndex()) { ymGoal("home_card_open"); openCardSheet(c.dataset.card); } else { ymGoal("home_card_neighbor"); snapTo(i); }
      return;
    }
    var h = t.closest("[data-home]");
    if (h) ymGoal("home_" + h.dataset.home);
    if (h && (h.dataset.home === "topup" || h.dataset.home === "transfer")) enter(h.dataset.home, activeCard());
  });
  document.addEventListener("keydown", function (e) { if (window.PROTO_MODE === "home" && e.key === "Escape" && csCard) closeCardSheet(); });
  function restartAll() {
    CARDS.forEach(function (c, i) { c.bal = BASE_BAL[i]; });
    Object.keys(flows).forEach(function (k) { flows[k].restart(); flows[k].setScreen("off"); });
    csLayer.hidden = true; csLayer.classList.remove("is-open"); csCard = null;
    home.hidden = false; home.style.zIndex = ""; navBusy = false; cur = 0; setX(0, false);
    window.PROTO_MODE = "home"; refreshHome();
  }

  function fit() {
    var w = document.documentElement.clientWidth - 32, h = window.innerHeight - 32;
    var s = Math.min(1, w / 375, Math.max(h, 400) / 812);
    document.documentElement.style.setProperty("--s", String(Math.max(0.4, s)));
  }
  window.addEventListener("resize", fit); fit();
  restartAll();
})();
